<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Share The Bite - Zero Hunger Platform</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 to root index.html preserving the hash route
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var search = l.search ? l.search : '';
      var hash = l.hash ? l.hash : '';
      if (path) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
          path + search + hash
        );
      } else {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/'
        );
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Share The Bite platform...</p>
  </body>
</html>
